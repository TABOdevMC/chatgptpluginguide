name: Classify guide difficulty

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize difficulty levels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('guides.html')
          text = path.read_text(encoding='utf-8')

          # Keep four explicit levels:
          # green = beginner, blue = intermediate, yellow = advanced, purple = expert.
          text = text.replace(
              ".level.advanced{color:#d1adff}.level.expert{color:#ffcb7a}",
              ".level.advanced{color:#ffd35a}.level.expert{color:#c49bff}"
          )
          text = text.replace(
              "const LEVELS={beginner:['Débutant','beginner','🟢'],intermediate:['Intermédiaire','intermediate','🔵'],advanced:['Avancé','advanced','🟣'],expert:['Expert','expert','🟠']};",
              "const LEVELS={beginner:['Débutant','beginner','🟢'],intermediate:['Intermédiaire','intermediate','🔵'],advanced:['Avancé','advanced','🟡'],expert:['Expert','expert','🟣']};"
          )
          text = text.replace(
              "<option value=\"expert\">Expert</option>",
              "<option value=\"expert\">Expert</option>"
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- guides.html; then
            echo "No guide level normalization needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides.html
          git commit -m "style: use yellow advanced and purple expert"
          git push
